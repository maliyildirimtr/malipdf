name: Build iPad App (TestFlight)

# Builds the iPad app on a GitHub Mac (no Xcode needed on your computer) and
# uploads it to App Store Connect, where it appears in TestFlight.
#
# Secrets (App Store Connect › Users and Access › Integrations › App Store
# Connect API › Team Keys, a key with Admin access):
#   ASC_KEY_ID      Key ID
#   ASC_ISSUER_ID   Issuer ID
#   ASC_KEY_P8      Contents of the downloaded AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID   (already set for the Mac builds)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown in the App Store (e.g. 1.0)"
        required: true
        default: "1.0"

permissions:
  contents: read

env:
  CAPACITOR: "@capacitor/core@7 @capacitor/ios@7 @capacitor/cli@7 @capacitor/filesystem@7 @capacitor/share@7 @capacitor/clipboard@7 @capacitor/app@7 @capacitor/browser@7"

jobs:
  build-ipad:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [[ -z "$(printf '%s' "${!name:-}" | tr -d '[:space:]')" ]]; then
              echo "::error::Missing secret $name"
              missing=1
            fi
          done
          exit $missing

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save $CAPACITOR

      - name: Build web app
        run: GITHUB_SHA="$(git rev-parse HEAD)" npm run build:vite

      - name: Create the Xcode project
        run: |
          npx cap add ios
          node scripts/iosSetup.mjs
          npx cap sync ios

      - name: App icon
        run: |
          icon=ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          # App Store icons may not be transparent: flatten through JPEG.
          sips -s format jpeg -z 1024 1024 build/icon.png --out "$RUNNER_TEMP/icon.jpg"
          sips -s format png "$RUNNER_TEMP/icon.jpg" --out "$icon"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ inputs.version }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" > "$key"
          if [[ -d ios/App/App.xcworkspace ]]; then target=(-workspace ios/App/App.xcworkspace); else target=(-project ios/App/App.xcodeproj); fi
          xcodebuild archive "${target[@]}" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MaliPDF.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MaliPDF.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
