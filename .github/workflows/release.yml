name: Build MaliPDF Release

# Push a tag like v0.2.0 to build installers and publish a GitHub Release.
# The tag becomes the app version (About MaliPDF, update checks).
#
# Code signing is optional. Add these repository secrets to turn it on:
#   macOS:   CSC_LINK (base64 .p12 "Developer ID Application"), CSC_KEY_PASSWORD,
#            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID  (notarization)
#   Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
# Without them the installers are built unsigned (as before).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  ELECTRON_BUILDER: electron-builder@25.1.8

jobs:
  build-macos-arm64:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use tag as app version
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build application
        run: npm run build

      - name: Package Apple Silicon DMG
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx --yes "$ELECTRON_BUILDER" --mac dmg --arm64 --publish never

      - name: Collect artifact
        run: |
          mkdir -p artifacts
          FILE=$(find release -maxdepth 1 -type f -name "*.dmg" | head -1)
          cp "$FILE" artifacts/MaliPDF-macOS-Apple-Silicon.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: artifacts/MaliPDF-macOS-Apple-Silicon.dmg

  build-macos-x64:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use tag as app version
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build application
        run: npm run build

      - name: Package Intel DMG
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx --yes "$ELECTRON_BUILDER" --mac dmg --x64 --publish never

      - name: Collect artifact
        run: |
          mkdir -p artifacts
          FILE=$(find release -maxdepth 1 -type f -name "*.dmg" | head -1)
          cp "$FILE" artifacts/MaliPDF-macOS-Intel.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: artifacts/MaliPDF-macOS-Intel.dmg

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use tag as app version
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build application
        run: npm run build

      - name: Package Windows installer
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx --yes ${{ env.ELECTRON_BUILDER }} --win nsis --x64 --publish never

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $file = Get-ChildItem -Path release -Filter *.exe -File | Select-Object -First 1

          if (-not $file) {
            throw "Windows installer was not found."
          }

          Copy-Item $file.FullName artifacts/MaliPDF-Windows-x64-Setup.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/MaliPDF-Windows-x64-Setup.exe

  release:
    needs:
      - build-macos-arm64
      - build-macos-x64
      - build-windows

    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MaliPDF ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release-files/MaliPDF-macOS-Apple-Silicon.dmg
            release-files/MaliPDF-macOS-Intel.dmg
            release-files/MaliPDF-Windows-x64-Setup.exe
