name: Build MaliPDF Release

# Push a tag like v0.2.0 to build installers and publish a GitHub Release.
# The tag becomes the app version (About MaliPDF, update checks).
#
# Code signing is optional. Add these repository secrets to turn it on:
#   macOS:   CSC_LINK (base64 .p12 "Developer ID Application"), CSC_KEY_PASSWORD,
#            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID  (notarization)
#   Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
# Without them the installers are built unsigned (as before).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

env:
  ELECTRON_BUILDER: electron-builder@25.1.8
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build-macos-arm64:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use tag as app version
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: Build application
        shell: bash
        run: GITHUB_SHA="$(git rev-parse HEAD)" npm run build

      - name: Package Apple Silicon DMG
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An empty (or blank) secret must not reach electron-builder: it
          # reads CSC_LINK="" as the project folder and fails with
          # "<project> not a file". Without a certificate, build unsigned.
          if [[ -z "$(printf '%s' "${CSC_LINK:-}" | tr -d '[:space:]')" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "No signing certificate: building an unsigned DMG."
          fi
          if [[ -z "$(printf '%s' "${APPLE_ID:-}" | tr -d '[:space:]')" ]]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npx --yes "$ELECTRON_BUILDER" --mac dmg --arm64 --publish never

      - name: Collect artifact
        run: |
          mkdir -p artifacts
          FILE=$(find release -maxdepth 1 -type f -name "*.dmg" | head -1)
          cp "$FILE" artifacts/MaliPDF-macOS-Apple-Silicon.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: artifacts/MaliPDF-macOS-Apple-Silicon.dmg

  build-macos-x64:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use tag as app version
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: Build application
        shell: bash
        run: GITHUB_SHA="$(git rev-parse HEAD)" npm run build

      - name: Package Intel DMG
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An empty (or blank) secret must not reach electron-builder: it
          # reads CSC_LINK="" as the project folder and fails with
          # "<project> not a file". Without a certificate, build unsigned.
          if [[ -z "$(printf '%s' "${CSC_LINK:-}" | tr -d '[:space:]')" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "No signing certificate: building an unsigned DMG."
          fi
          if [[ -z "$(printf '%s' "${APPLE_ID:-}" | tr -d '[:space:]')" ]]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npx --yes "$ELECTRON_BUILDER" --mac dmg --x64 --publish never

      - name: Collect artifact
        run: |
          mkdir -p artifacts
          FILE=$(find release -maxdepth 1 -type f -name "*.dmg" | head -1)
          cp "$FILE" artifacts/MaliPDF-macOS-Intel.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: artifacts/MaliPDF-macOS-Intel.dmg

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use tag as app version
        shell: bash
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: Build application
        shell: bash
        run: GITHUB_SHA="$(git rev-parse HEAD)" npm run build

      - name: Package Windows installer
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$(printf '%s' "${CSC_LINK:-}" | tr -d '[:space:]')" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          npx --yes "$ELECTRON_BUILDER" --win nsis --x64 --publish never

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $file = Get-ChildItem -Path release -Filter *.exe -File | Select-Object -First 1

          if (-not $file) {
            throw "Windows installer was not found."
          }

          Copy-Item $file.FullName artifacts/MaliPDF-Windows-x64-Setup.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/MaliPDF-Windows-x64-Setup.exe

  release:
    needs:
      - build-macos-arm64
      - build-macos-x64
      - build-windows

    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Checkout release notes
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: source
          sparse-checkout: release-notes

      - name: Prepare release notes
        # release-notes/<tag>.md (from the tagged commit, or main) becomes the
        # release description; GitHub's generated changelog is added below it.
        run: |
          NOTES="release-notes/${RELEASE_TAG}.md"
          cd source
          if [[ ! -f "$NOTES" ]]; then
            git fetch --depth=1 origin main && git checkout FETCH_HEAD -- "$NOTES" 2>/dev/null || true
          fi
          if [[ -f "$NOTES" ]]; then cp "$NOTES" ../release-body.md; else : > ../release-body.md; fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-body.md
          tag_name: ${{ env.RELEASE_TAG }}
          name: MaliPDF ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          files: |
            release-files/MaliPDF-macOS-Apple-Silicon.dmg
            release-files/MaliPDF-macOS-Intel.dmg
            release-files/MaliPDF-Windows-x64-Setup.exe
