name: Build MaliPDF Release

# Push a tag like v1.0.2 to build the store packages and publish a GitHub
# Release with the release notes. The tag becomes the app version.
#
# MaliPDF ships through the app stores, which also update it:
#   Mac App Store   → artifact "mac-app-store" (.pkg): upload with Apple's
#                     Transporter app to App Store Connect.
#   Microsoft Store → artifact "microsoft-store" (.appx): upload in Partner
#                     Center → Packages. Unsigned: the Store signs it.
# (Actions → the run → Artifacts.)
#
# Repository secrets for the Mac App Store build:
#   MAS_CSC_LINK            base64 .p12 with "Apple Distribution" and
#                           "Mac Installer Distribution" certificates + keys
#   MAS_CSC_KEY_PASSWORD    its password
#   MAS_PROVISIONING_PROFILE base64 "Mac App Store" provisioning profile for
#                           com.maliyildirimtr.malipdf
#   APPLE_TEAM_ID           your 10-character Team ID

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

env:
  ELECTRON_BUILDER: electron-builder@25.1.8
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build-mac-app-store:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use tag as app version
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: Build application
        shell: bash
        run: GITHUB_SHA="$(git rev-parse HEAD)" npm run build

      - name: Package for the Mac App Store
        env:
          CSC_LINK: ${{ secrets.MAS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD MAS_PROVISIONING_PROFILE APPLE_TEAM_ID; do
            if [[ -z "$(printf '%s' "${!name:-}" | tr -d '[:space:]')" ]]; then
              echo "::error::Missing secret for $name (see the top of release.yml)."
              exit 1
            fi
          done
          printf '%s' "$MAS_PROVISIONING_PROFILE" | base64 --decode > build/embedded.provisionprofile
          sed -i '' "s/TEAM_ID\./${APPLE_TEAM_ID}./" build/entitlements.mas.plist
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.build.mas.extendInfo.ElectronTeamID=process.env.APPLE_TEAM_ID;fs.writeFileSync("package.json",JSON.stringify(p,null,2));'
          npx --yes "$ELECTRON_BUILDER" --mac mas --arm64 --publish never

      - name: Collect Mac App Store package
        run: |
          mkdir -p store
          FILE=$(find release -type f -name "*.pkg" | head -1)
          if [[ -z "$FILE" ]]; then echo "::error::Mac App Store package was not found."; exit 1; fi
          cp "$FILE" store/MaliPDF-MacAppStore.pkg

      - name: Upload Mac App Store package
        uses: actions/upload-artifact@v4
        with:
          name: mac-app-store
          path: store/MaliPDF-MacAppStore.pkg

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use tag as app version
        shell: bash
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: Build application
        shell: bash
        run: GITHUB_SHA="$(git rev-parse HEAD)" npm run build

      - name: Package Microsoft Store app (APPX)
        # Unsigned on purpose: the Microsoft Store signs the package after
        # certification. Upload this file in Partner Center → Packages.
        shell: bash
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD
          npx --yes "$ELECTRON_BUILDER" --win appx --x64 --publish never

      - name: Collect Microsoft Store package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path store | Out-Null
          $file = Get-ChildItem -Path release -Filter *.appx -File | Select-Object -First 1
          if (-not $file) { throw "Microsoft Store package was not found." }
          Copy-Item $file.FullName store/MaliPDF-Windows-Store-x64.appx

      # Download it from the workflow run (Actions → this run → Artifacts →
      # microsoft-store) and upload it in Partner Center.
      - name: Upload Microsoft Store package
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-store
          path: store/MaliPDF-Windows-Store-x64.appx

  release:
    needs:
      - build-mac-app-store
      - build-windows

    runs-on: ubuntu-latest

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: source
          sparse-checkout: release-notes

      - name: Prepare release notes
        # release-notes/<tag>.md (from the tagged commit, or main) becomes the
        # release description; GitHub's generated changelog is added below it.
        run: |
          NOTES="release-notes/${RELEASE_TAG}.md"
          cd source
          if [[ ! -f "$NOTES" ]]; then
            git fetch --depth=1 origin main && git checkout FETCH_HEAD -- "$NOTES" 2>/dev/null || true
          fi
          if [[ -f "$NOTES" ]]; then cp "$NOTES" ../release-body.md; else : > ../release-body.md; fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-body.md
          tag_name: ${{ env.RELEASE_TAG }}
          name: MaliPDF ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
