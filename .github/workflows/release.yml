name: Build MaliPDF Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos-arm64:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package Apple Silicon DMG
        run: npx electron-builder --mac dmg --arm64 --publish never

      - name: Collect artifact
        run: |
          mkdir -p artifacts
          FILE=$(find . -type f -name "*.dmg" -not -path "./node_modules/*" | head -1)
          cp "$FILE" artifacts/MaliPDF-macOS-Apple-Silicon.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: artifacts/MaliPDF-macOS-Apple-Silicon.dmg

  build-macos-x64:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package Intel DMG
        run: npx electron-builder --mac dmg --x64 --publish never

      - name: Collect artifact
        run: |
          mkdir -p artifacts
          FILE=$(find . -type f -name "*.dmg" -not -path "./node_modules/*" | head -1)
          cp "$FILE" artifacts/MaliPDF-macOS-Intel.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: artifacts/MaliPDF-macOS-Intel.dmg

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $file = Get-ChildItem -Path . -Recurse -Filter *.exe |
            Where-Object {
              $_.FullName -notmatch "node_modules" -and
              $_.FullName -notmatch "win-unpacked"
            } |
            Select-Object -First 1

          if (-not $file) {
            throw "Windows installer was not found."
          }

          Copy-Item $file.FullName artifacts/MaliPDF-Windows-x64-Setup.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/MaliPDF-Windows-x64-Setup.exe

  release:
    needs:
      - build-macos-arm64
      - build-macos-x64
      - build-windows

    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MaliPDF ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            release-files/MaliPDF-macOS-Apple-Silicon.dmg
            release-files/MaliPDF-macOS-Intel.dmg
            release-files/MaliPDF-Windows-x64-Setup.exe
