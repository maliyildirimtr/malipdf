name: Build MaliPDF Release

# Push a tag like v1.0.2 to build the store packages and publish a GitHub
# Release with the release notes. The tag becomes the app version.
#
# MaliPDF ships through the app stores, which also update it:
#   Mac App Store   → artifact "mac-app-store" (.pkg): upload with Apple's
#                     Transporter app to App Store Connect.
#   Microsoft Store → artifact "microsoft-store" (.appx): upload in Partner
#                     Center → Packages. Unsigned: the Store signs it.
# (Actions → the run → Artifacts.)
#
# A direct download is built as well and attached to the GitHub Release:
#   macOS DMG (Apple Silicon), Developer ID signed and notarized when the
#   secrets below are set (unsigned otherwise):
#     CSC_LINK (base64 .p12 "Developer ID Application"), CSC_KEY_PASSWORD,
#     APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#
# Repository secrets for the Mac App Store build:
#   MAS_CSC_LINK            base64 .p12 with "Apple Distribution" and
#                           "Mac Installer Distribution" certificates + keys
#   MAS_CSC_KEY_PASSWORD    its password
#   MAS_PROVISIONING_PROFILE base64 "Mac App Store" provisioning profile for
#                           com.maliyildirimtr.malipdf
#   APPLE_TEAM_ID           your 10-character Team ID

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version or tag to release (e.g. 1.0.6 or v1.0.6)"
        required: true
        type: string

permissions:
  contents: write

env:
  ELECTRON_BUILDER: electron-builder@25.1.8

jobs:
  prepare-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Normalize and create tag if missing
        id: resolve
        env:
          RAW_INPUT: ${{ inputs.release_tag || github.ref_name }}
        run: |
          RAW="$(printf '%s' "$RAW_INPUT" | tr -d '[:space:]')"
          if [[ -z "$RAW" ]]; then
            echo "::error::Release version cannot be empty."
            exit 1
          fi
          if [[ "$RAW" == v* ]]; then
            TAG="$RAW"
          else
            TAG="v$RAW"
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Using existing tag $TAG"
          else
            echo "Creating and pushing new tag $TAG on HEAD ($(git rev-parse --short HEAD))"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-mac-app-store:
    needs: prepare-tag
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ needs.prepare-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-tag.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use tag as app version
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: Build application
        shell: bash
        run: GITHUB_SHA="$(git rev-parse HEAD)" npm run build

      - name: Package for the Mac App Store
        env:
          CSC_LINK: ${{ secrets.MAS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD MAS_PROVISIONING_PROFILE APPLE_TEAM_ID; do
            if [[ -z "$(printf '%s' "${!name:-}" | tr -d '[:space:]')" ]]; then
              echo "::error::Missing secret for $name (see the top of release.yml)."
              exit 1
            fi
          done
          printf '%s' "$MAS_PROVISIONING_PROFILE" | base64 --decode > build/embedded.provisionprofile
          sed -i '' "s/TEAM_ID\./${APPLE_TEAM_ID}./" build/entitlements.mas.plist
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.build.buildVersion=String(process.env.GITHUB_RUN_NUMBER||"1");p.build.mas.extendInfo.ElectronTeamID=process.env.APPLE_TEAM_ID;fs.writeFileSync("package.json",JSON.stringify(p,null,2));'
          npx --yes "$ELECTRON_BUILDER" --mac mas --arm64 --publish never

      - name: Collect Mac App Store package
        run: |
          mkdir -p store
          FILE=$(find release -type f -name "*.pkg" | head -1)
          if [[ -z "$FILE" ]]; then echo "::error::Mac App Store package was not found."; exit 1; fi
          cp "$FILE" store/MaliPDF-MacAppStore.pkg

      - name: Upload Mac App Store package
        uses: actions/upload-artifact@v4
        with:
          name: mac-app-store
          path: store/MaliPDF-MacAppStore.pkg

      - name: Upload Mac App Store package to App Store Connect
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [[ -z "$(printf '%s' "${ASC_KEY_ID:-}" | tr -d '[:space:]')" || -z "$(printf '%s' "${ASC_ISSUER_ID:-}" | tr -d '[:space:]')" || -z "$(printf '%s' "${ASC_KEY_P8:-}" | tr -d '[:space:]')" ]]; then
            echo "ASC API key secrets not set; skipping automatic App Store Connect upload."
            exit 0
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT
          xcrun altool --upload-app --type macos --file store/MaliPDF-MacAppStore.pkg --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

  build-macos-dmg:
    needs: prepare-tag
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ needs.prepare-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-tag.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use tag as app version
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: Build application
        shell: bash
        run: GITHUB_SHA="$(git rev-parse HEAD)" npm run build

      - name: Package Apple Silicon DMG
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          EXTRA_ARGS=()
          if [[ -z "$(printf '%s' "${CSC_LINK:-}" | tr -d '[:space:]')" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # Bind Info.plist & resources cleanly with ad-hoc signature when no Developer ID cert is configured
            EXTRA_ARGS+=(-c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false)
            echo "No Developer ID certificate (CSC_LINK): building clean ad-hoc signed DMG."
          else
            # Use App Store Connect API key for Apple Notarization automatically when APPLE_ID is not set
            if [[ -z "$(printf '%s' "${APPLE_ID:-}" | tr -d '[:space:]')" ]]; then
              unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD
              if [[ -n "$(printf '%s' "${ASC_KEY_ID:-}" | tr -d '[:space:]')" && -n "$(printf '%s' "${ASC_ISSUER_ID:-}" | tr -d '[:space:]')" && -n "$(printf '%s' "${ASC_KEY_P8:-}" | tr -d '[:space:]')" ]]; then
                KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
                printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
                chmod 600 "$KEY_PATH"
                trap 'rm -f "$KEY_PATH"' EXIT
                export APPLE_API_KEY="$KEY_PATH"
                export APPLE_API_KEY_ID="$ASC_KEY_ID"
                export APPLE_API_ISSUER="$ASC_ISSUER_ID"
                echo "Notarizing Developer ID DMG via App Store Connect API key ($ASC_KEY_ID)."
              else
                EXTRA_ARGS+=(-c.mac.notarize=false)
                echo "No notarization credentials: skipping notarization."
              fi
            fi
          fi
          npx --yes "$ELECTRON_BUILDER" --mac dmg --arm64 --publish never "${EXTRA_ARGS[@]}"

      - name: Collect DMG
        run: |
          mkdir -p artifacts
          FILE=$(find release -maxdepth 1 -type f -name "*.dmg" | head -1)
          if [[ -z "$FILE" ]]; then echo "::error::DMG was not found."; exit 1; fi
          cp "$FILE" artifacts/MaliPDF-macOS-Apple-Silicon.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/MaliPDF-macOS-Apple-Silicon.dmg

  build-windows:
    needs: prepare-tag
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.prepare-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-tag.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use tag as app version
        shell: bash
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: Build application
        shell: bash
        run: GITHUB_SHA="$(git rev-parse HEAD)" npm run build

      - name: Package Microsoft Store app (APPX)
        # Unsigned on purpose: the Microsoft Store signs the package after
        # certification. Upload this file in Partner Center → Packages.
        shell: bash
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD
          npx --yes "$ELECTRON_BUILDER" --win appx --x64 --publish never

      - name: Collect Microsoft Store package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path store | Out-Null
          $file = Get-ChildItem -Path release -Filter *.appx -File | Select-Object -First 1
          if (-not $file) { throw "Microsoft Store package was not found." }
          Copy-Item $file.FullName store/MaliPDF-Windows-Store-x64.appx

      # Download it from the workflow run (Actions → this run → Artifacts →
      # microsoft-store) and upload it in Partner Center.
      - name: Upload Microsoft Store package
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-store
          path: store/MaliPDF-Windows-Store-x64.appx

  release:
    needs:
      - prepare-tag
      - build-mac-app-store
      - build-macos-dmg
      - build-windows

    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare-tag.outputs.tag }}

    steps:
      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: release-files

      - name: Checkout release notes
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-tag.outputs.tag }}
          path: source
          sparse-checkout: release-notes

      - name: Prepare release notes
        # release-notes/<tag>.md (from the tagged commit, or main) becomes the
        # release description; GitHub's generated changelog is added below it.
        run: |
          NOTES="release-notes/${RELEASE_TAG}.md"
          cd source
          if [[ ! -f "$NOTES" ]]; then
            git fetch --depth=1 origin main && git checkout FETCH_HEAD -- "$NOTES" 2>/dev/null || true
          fi
          if [[ -f "$NOTES" ]]; then cp "$NOTES" ../release-body.md; else : > ../release-body.md; fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-body.md
          tag_name: ${{ needs.prepare-tag.outputs.tag }}
          name: MaliPDF ${{ needs.prepare-tag.outputs.tag }}
          prerelease: ${{ contains(needs.prepare-tag.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            release-files/MaliPDF-macOS-Apple-Silicon.dmg
